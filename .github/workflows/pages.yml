# Build the documentation site (docs/) and publish it to GitHub Pages.
#
# The site lives under docs/ with its own Makefile, separate from the C build.
# Enable Pages in the repo settings with Source = "GitHub Actions" (not
# "Deploy from a branch"), or the deploy step fails with an unhelpful 404.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lowdown

      - name: Build
        run: make -C docs site

      - name: Check output
        run: make -C docs check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
