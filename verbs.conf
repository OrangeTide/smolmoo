# verbs.conf : verb object definitions for smolmoo install
# Format: obj_id parent verb_name source_file [mode] [args_spec]
#
# obj_id    - persistent object number
# parent    - parent object (400 = Verb Prototype)
# verb_name - command name players type
# source    - .c file (compiled to .elf automatically)
# mode      - octal permission (default 0755). The setuid bit (04000) lets the
#             verb elevate to its owner's authority via grant_accept(); see
#             OLC.md. Gameplay verbs that write shared state (rooms, NPCs,
#             loose items) carry it; player-facing verbs that only touch the
#             caller's own sheet do not.
# args_spec - typed slot spec (omit for no-arg verbs)

401 400 look      verb_look.moo        0755
402 400 testget   verb_test_args.c     0755 <obj>
403 400 testput   verb_test_args.c     0755 <obj> in <obj>
404 400 testgive  verb_test_args.c     0755 <obj> <atom=to|at> <player>
405 400 testsetprop verb_test_setprop.c 0755 <obj>
406 400 testobjfind verb_test_objfind.c 0755 <text>
