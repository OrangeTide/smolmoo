# verb is not typed by players but named by an object's `brain` prop for @wake.
452 400 __ticker  agent_ticker.c       04755

# OLC-6: proactive mob agent (wander/patrol on a timer, greet/aggro on entry).
# Setuid: it moves the mob and opens fights. Named by a mob's `brain` for @wake.
453 400 __rover   agent_mob.c          04755

# OLC-7: vehicles. board/disembark move the player (setuid, like go). __transit
# is the vehicle agent (agent_ prefix links -lverbmain); a vehicle names it in
# its `brain` and is started with @wake. Timed trains tick; elevators move on an
# EV_USER "floor <n>" routed from a rider's command.
454 400 board     verb_vehicle.c       04755 <obj>
455 400 disembark verb_vehicle.c       04755
456 400 __transit agent_vehicle.c      04755
457 400 floor     verb_vehicle.c       0755 <text>
